[project]
name = "paws"
version = "1.0.0"
description = "Python Automation for Weave Searches — manages Condor jobs and analysis for directed CW searches using WEAVE"
authors = [{ name = "Damon Cheung", email = "damoncht@umich.edu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "astropy",
    "tqdm",
    "scipy",
    "pyfstat",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/damondmc/paws"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paws"]

[tool.ruff]
exclude = ["example/"]

[tool.ruff.lint]
select = ["I"]
