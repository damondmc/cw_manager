name: Build Apptainer Image

on:
  push:
    branches: [ main ]  # Runs automatically whenever you push code to the main branch

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out your code
        uses: actions/checkout@v4

      - name: Set up Apptainer environment
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: '1.3.6'

      - name: Build SIF Image using your paws.def
        run: apptainer build paws.sif paws.def

      - name: Save the finished image as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: paws-sif-image
          path: paws.sif
